# intent.yaml: what the lab API should hold, for the Week 7 assignment. Your sync.py makes it so.
#
# Replace 4207 with the last 4 digits of your student ID, and every 10.7. with 10.NN.,
# where NN is the last 2 digits (as a number: 07 → 7). Then make it your own network's intent.
#
# Requirements:
#   - at least 6 VLANs (ids 2 to 4094 — VLAN 1 belongs to the API), each with a name
#     (1 to 32 letters, digits, '-' or '_');
#   - at least 4 ACL entries, on your own addresses (10.NN.0.0/16), including at least one
#     permit and one deny, and at least one with a port (tcp or udp only).
# Anything on the API that ISN'T here is removed by sync.py (except VLAN 1): this file is the
# whole truth, like Week 2's network.yaml.


# WIC2005 Week 7 - Desired Network State
# Student ID suffix: 4965
# Network: University Data Centre
#
# This file defines the exact intended VLANs and ACL rules.
# VLAN 1 is managed by the API and must not be deleted.

student_id_last4: "4965"

vlans:
  - {id: 10, name: students}
  - {id: 20, name: servers}
  - {id: 30, name: guests}
  - {id: 40, name: lecturers}
  - {id: 50, name: admin}
  - {id: 60, name: research}

acl:
  - action: deny
    src: 10.65.30.0/24
    dst: 10.65.20.0/24
    protocol: tcp
    port: 22
    description: guests-no-ssh

  - action: permit
    src: 10.65.10.0/24
    dst: 10.65.20.0/24
    protocol: tcp
    port: 443
    description: students-https

  - action: permit
    src: 10.65.40.0/24
    dst: 10.65.20.0/24
    protocol: tcp
    port: 22
    description: lecturers-ssh

  - action: deny
    src: 10.65.30.0/24
    dst: 10.65.50.0/24
    protocol: tcp
    port: 3389
    description: guests-no-rdp

  - action: permit
    src: 10.65.60.0/24
    dst: 10.65.20.0/24
    protocol: tcp
    port: 443
    description: research-https
